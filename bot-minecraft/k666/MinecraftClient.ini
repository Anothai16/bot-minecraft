# Startup Config File
# Please do not record extraneous data in this file as it will be overwritten by MCC.
# 
# New to Minecraft Console Client? Check out this document: https://mccteam.github.io/g/conf.html
# Want to upgrade to a newer version? See https://github.com/MCCTeam/Minecraft-Console-Client/#download
[Head]
"Current Version" = "GitHub build 500, built on 2026-08-09 from commit 8e11304"
"Latest Version" = "GitHub build 505, built on 2026-08-11"

[Main]
[Main.General]
Account = { Login = "Lervy_Lever", Password = "-" } # Login=Email or Name. Use "-" as password for offline mode. Leave blank to prompt user on startup.
Server = { Host = "play.amorycraft.com" }   # The address of the game server, "Host" can be filled in with domain name or IP address. (The "Port" field can be deleted, it will be resolved automatically)
AccountType = "mojang"                      # Account type: "mojang" OR "microsoft" OR "yggdrasil". Also affects interactive login in console.
Method = "mcc"                              # Microsoft Account sign-in method: "mcc" (device code, supports 2FA) OR "browser" (manual browser login).
AuthServerUrl = ""                          # Authlib-injector URL to use for Yggdrasil accounts. It must use http or https and include any required path.
AuthUser = ""                               # Yggdrasil authlib multi-user selection.
[Main.Advanced]
EnableSentry = false                        # Set to false to opt-out of Sentry error logging.
Language = "en_us"                          # Fill in with in-game locale code, check https://mccteam.github.io/r/l-code.html
LoadMccTranslation = false                  # Load translations applied to MCC when available, turn it off to use English only.
LoadResourcePackTranslations = false        # Load translations from server resource packs and cache extracted language entries locally for faster reuse.
LoadForgeModTranslations = false            # Load translations from local Forge mod jars when their mod IDs are announced by the server. Disabled by default.
AutoDiscoverForgeModTranslationSources = false # Also scan standard Minecraft, Prism Launcher, and CurseForge instance mod folders for translation jars when available.
ForgeModTranslationPath = ""                # Optional path to a mods folder. When set, MCC loads Forge mod translations from this folder instead of automatic discovery.
ConsoleTitle = "%username%@%serverip% - Minecraft Console Client"
InternalCmdChar = "slash"                   # Use "none", "slash"(/) or "backslash"(\).
MessageCooldown = 1.0                       # Controls the minimum interval (in seconds) between sending each message to the server.
MaxChatMessageLength = 100                  # Override the maximum chat message length. Set to 0 to use the default (100 for 1.10 and below, 256 for 1.11+). WARNING: Setting this incorrectly may cause you to be kicked from the server.
BotOwners = [ ]                             # Set the owner of the bot. /!\ Server admins can impersonate owners!
MinecraftVersion = "1.20.1"                 # Use "auto" or "1.X.X" values. Allows to skip server info retrieval.
EnableForge = "no"                          # Use "auto", "no" or "force". Force-enabling only works for MC 1.13+.
BrandInfo = "mcc"                           # Use "mcc", "vanilla" or "none". This is how MCC identifies itself to the server.
ChatbotLogFile = ""                         # Leave empty for no logfile.
PrivateMsgsCmdName = "tell"                 # For remote control of the bot.
ShowSystemMessages = true                   # System messages for server ops (เปิดเพื่อเช็คข้อความระบบ).
ShowXPBarMessages = false                   # Messages displayed above xp bar, set this to false in case of xp bar spam.
ShowChatLinks = false                       # Decode links embedded in chat messages and show them in console.
ShowInventoryLayout = true                  # Show inventory layout as ASCII art in inventory command (เปิดเพื่อดู GUI เมนู).
ShowEffectMessages = false                  # Show chat notifications when your active effects are gained or expire. Set to false to disable these messages entirely.
ShowEffectNamesInTUI = false                # Show full effect names and levels in the TUI status bar instead of compact effect icons only.
ShowGithubStarReminder = false              # Show a GitHub star reminder on startup. Set to false to hide it.
TerrainAndMovements = false                 # Uses more ram, cpu, bandwidth but allows you to move around.
MoveHeadWhileWalking = false                # Enable head movement while walking to avoid anti-cheat triggers.
MovementSpeed = 2                           # A movement speed higher than 2 may be considered cheating.
TemporaryFixBadpacket = false               # Temporary fix for Badpacket issue on some servers. Need to enable "TerrainAndMovements" first.
InventoryHandling = true                    # Toggle inventory handling.
EntityHandling = false                      # Toggle entity handling.
SessionCache = "none"                       # How to retain session tokens. Use "none", "memory" or "disk".
ProfileKeyCache = "none"                    # How to retain profile key. Use "none", "memory" or "disk".
ResolveSrvRecords = "fast"                  # Use "no", "fast" (5s timeout), or "yes". Required for joining some servers.
PlayerHeadAsIcon = false                    # Only works on Windows XP-8 or Windows 10 with old console.
ExitOnFailure = false                       # Whether to exit directly when an error occurs, for using MCC in non-interactive scripts.
CacheScript = false                         # Cache compiled scripts for faster load on low-end devices.
Timestamps = false                          # Prepend timestamps to chat messages.
AutoRespawn = false                         # Toggle auto respawn if client player was dead (make sure your spawn point is safe).
MinecraftRealms = false                     # Enable support for joining Minecraft Realms worlds.
TcpTimeout = 30                             # Customize the TCP connection timeout with the server. (in seconds)
EnableEmoji = false                         # If turned off, the emoji will be replaced with a simpler character (for /chunk status).
MinTerminalWidth = 16                       # The minimum width used when calculating the image size from the width of the terminal.
MinTerminalHeight = 10                      # The minimum height to use when calculating the image size from the height of the terminal.
IgnoreInvalidPlayerName = true              # Ignore invalid player name

